<div class="min-h-screen bg-white dark:bg-gray-900 transition-colors duration-300">
  <button
    type="button"
    class="fixed top-4 right-4 z-50 p-2 rounded-full shadow bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-yellow-300 hover:scale-105 transition duration-300 ease-in-out"
    (click)="themeService.toggle()"
  >
    <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
  <router-outlet />
</div>
